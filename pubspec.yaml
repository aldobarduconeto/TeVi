name: tevi
description: Conexões por proximidade com foco em privacidade. Aproxime-se de pessoas onde seus caminhos se cruzam, com segurança e controle total dos seus dados.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.7
  record: ^7.1.1
  qr_flutter: ^4.1.0
  geolocator: ^14.1.2
  image_picker: ^1.2.3
  url_launcher: ^6.3.3
  audioplayers: ^6.8.1
  pointycastle: ^4.0.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.6
  sign_in_with_apple: ^8.2.0
  flutter_webrtc: ^1.6.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter

dependency_overrides:
  permission_handler_android: 12.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/branding/app_icon_foreground.png
